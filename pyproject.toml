[project]
name = "runcell-official-skills"
version = "0.1.0"
description = "Canonical source and release tooling for RunCell-maintained skills"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
document-validation = [
  "python-docx>=1.2,<2",
  "pypdf>=6,<8",
  "pdfplumber>=0.11,<1",
  "reportlab>=4,<5",
  "pytest>=8,<10",
]
